<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DIGITA - Manajemen Mutu & Siklus Aset PLN{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        /* Styling Sidebar Tetap di Samping */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: 250px;
            background-color: #0b253a;
            color: #fff;
            z-index: 1000;
            padding-top: 20px;
        }
        /* Konten Utama bergeser ke kanan menyesuaikan sidebar */
        .main-wrapper {
            margin-left: 250px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .content-body {
            padding: 30px;
            flex: 1;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>

    <!-- SIDEBAR -->
    {% include 'sidebar.html' %}

    <!-- WRAPPER UTAMA (Navbar + Konten) -->
    <div class="main-wrapper">
        
        <!-- NAVBAR ATAS -->
        {% include 'navbar.html' %}

        <!-- KONTEN DINAMIS DARI MASING-MASING MODUL -->
        <div class="content-body">
            {% block content %}{% endblock %}
        </div>

        <!-- FOOTER SEDERHANA -->
        <footer class="bg-white text-center py-3 border-top text-muted small">
            &copy; 2026 <strong>DIGITA</strong> - Manajemen Mutu & Siklus Aset PLN. All rights reserved.
        </footer>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>

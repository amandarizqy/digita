<html lang="id">
<head>
<meta charset="UTF-8">

<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="../assets/css/riwayat_pelunasan.css" rel="stylesheet">
</head>
<body>

<div class="page-wrap narrow">

  <div class="breadcrumb-bar">
    Perencanaan &nbsp;/&nbsp; Input &nbsp;/&nbsp;
    <a href="riwayat_pelunasan.html">Riwayat Pelunasan</a> &nbsp;/&nbsp;
    <span class="current">Tambah Data</span>
  </div>
  <h1 class="page-title">Tambah Riwayat Pelunasan</h1>

  <div id="formAlert" class="form-alert"></div>

  <form class="form-card" id="formPelunasan" method="POST" enctype="multipart/form-data">

    <div class="section-label">Data Aset</div>

    <div class="mb-field">
      <label class="field-label">Kode / Nama Aset <span class="req">*</span></label>
      <select class="form-select" name="aset_id" id="asetSelect" required>
        <option value="">— Pilih aset —</option>
      </select>
      <div class="asset-preview" id="asetPreview">
        Jenis aset: <b id="prevJenis">-</b> &nbsp;•&nbsp; Sisa tagihan sebelumnya: <b id="prevSisa">-</b>
      </div>
    </div>

    <div class="section-label">Detail Pelunasan</div>

    <div class="row-2 mb-field">
      <div>
        <label class="field-label">Jenis Pelunasan <span class="req">*</span></label>
        <select class="form-select" name="jenis_pelunasan" required>
          <option value="">— Pilih —</option>
          <option value="lunas">Lunas Penuh</option>
          <option value="cicilan">Cicilan / Termin</option>
        </select>
      </div>
      <div>
        <label class="field-label">Tanggal Pelunasan <span class="req">*</span></label>
        <input type="date" class="form-control" name="tanggal_pelunasan" required>
      </div>
    </div>

    <div class="row-2 mb-field">
      <div>
        <label class="field-label">Nominal Pelunasan (Rp) <span class="req">*</span></label>
        <input type="number" class="form-control" name="nominal" placeholder="0" min="0" required>
      </div>
      <div>
        <label class="field-label">Metode Pembayaran <span class="req">*</span></label>
        <select class="form-select" name="metode_pembayaran" required>
          <option value="">— Pilih —</option>
          <option value="transfer">Transfer Bank</option>
          <option value="tunai">Tunai</option>
          <option value="giro">Giro</option>
        </select>
      </div>
    </div>

    <div class="mb-field">
      <label class="field-label">No. Referensi / Bukti Transaksi</label>
      <input type="text" class="form-control" name="no_referensi" placeholder="Contoh: TRF-09182026-001">
    </div>

    <div class="mb-field">
      <label class="field-label">Unggah Bukti Pembayaran</label>
      <label class="upload-box" for="fileUpload">
        <i class="fa-solid fa-cloud-arrow-up"></i>
        Klik untuk pilih file, atau seret file ke sini (PDF/JPG, maks 5MB)
      </label>
      <input type="file" id="fileUpload" name="bukti_pembayaran" accept=".pdf,.jpg,.jpeg,.png" hidden>
    </div>

    <div class="mb-field">
      <label class="field-label">Keterangan</label>
      <textarea class="form-control" name="keterangan" rows="3" placeholder="Catatan tambahan (opsional)"></textarea>
    </div>

    <div class="form-actions">
      <a href="index.html" class="btn-cancel">Batal</a>
      <button type="submit" class="btn-save"><i class="fa-solid fa-floppy-disk"></i> Simpan Data</button>
    </div>

  </form>
</div>

<script src="../../../assets/js/riwayat_pelunasan.js"></script>
</body>
</html>
